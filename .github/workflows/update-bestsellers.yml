name: Update bestseller snapshots
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bestseller-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect Amazon and Noon rankings
        run: node scripts/scrape-bestsellers.mjs
      - name: Save daily snapshot
        run: |
          git config user.name "bestseller-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/bestsellers
          git diff --cached --quiet || git commit -m "data: update daily bestseller snapshot"
          git push
